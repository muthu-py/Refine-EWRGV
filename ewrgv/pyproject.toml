[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ewrgv"
version = "0.1.0"
description = "Evidence-Weighted Research Gap Validation (EWRGV) for RAG-Based Research-Gap Identification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "EWRGV Research Team"},
]
keywords = ["RAG", "research-gap", "NLP", "information-retrieval", "EWRGV"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP client (for literature collectors)
    "httpx>=0.27.0",

    # Typing backports
    "typing-extensions>=4.11.0",
]

[project.optional-dependencies]
# LLM providers (install when implementing providers)
openai = ["openai>=1.30.0"]

# Embeddings
sentence-transformers = ["sentence-transformers>=3.0.0"]

# Retrieval (install when implementing retrieval)
retrieval = [
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
]

# All optional dependencies
all = [
    "openai>=1.30.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
]

# Development dependencies
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
